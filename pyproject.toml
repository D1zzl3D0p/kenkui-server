[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kenkui-server"
version = "10.0.0"
description = "Local-first Kenkui API server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Kenkui contributors" }]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "defusedxml>=0.7.1,<0.8",
  "fastapi>=0.115,<0.130",
  "kenkui>=10.0,<11",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[tool.uv.sources]
kenkui = { path = "../kenkui", editable = true }

[project.scripts]
kenkui-server = "kenkui_server.main:main"

[project.optional-dependencies]
hosted = [
    "boto3>=1.35,<2",
    "modal>=1,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "workos>=5,<6",
]

[dependency-groups]
dev = [
  "alembic>=1.14,<2.0",
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
strict = true
packages = ["kenkui_server"]

[tool.hatch.build.targets.wheel]
packages = ["src/kenkui_server"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/postgresql" = "kenkui_server/migrations/postgresql"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
