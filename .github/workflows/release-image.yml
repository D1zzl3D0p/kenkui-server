name: Build verified release image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: kenkui-server
      - name: Require immutable library revision
        env:
          CORE_REF: ${{ vars.KENKUI_CORE_REF }}
        run: '[[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.KENKUI_CORE_REPOSITORY }}
          ref: ${{ vars.KENKUI_CORE_REF }}
          path: kenkui
          token: ${{ secrets.KENKUI_REPO_READ_TOKEN || github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: kenkui-server/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            fm.kenkui.core.revision=${{ vars.KENKUI_CORE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable deployment image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
