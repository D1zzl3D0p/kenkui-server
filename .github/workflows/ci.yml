name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      - run: uv run pytest tests/test_health.py tests/test_capabilities.py tests/test_errors.py tests/test_observability.py tests/test_main.py tests/test_openapi.py
      - run: uv run mypy
      - run: uv run ruff check .
