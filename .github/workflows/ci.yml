name: Rehearse reviewed Neon verification on Linux
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected release target (packages only; no provider writes)
        type: choice
        required: true
        options: [staging, production]
      studio_ref:
        description: Reviewed immutable Studio commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: isolated-neon-rehearsal-${{ inputs.environment || github.ref }}
  cancel-in-progress: false
env:
  NODE_VERSION: 24.21.0
  WRANGLER_SEND_METRICS: 'false'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kenkui-server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55438:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 254543854d8e9cfd8b7ebfb71f693efc03a85fa7
          path: kenkui-server
      - uses: actions/checkout@v4
        with:
          repository: D1zzl3D0p/kenkui
          ref: 97cba6bdb663c15d2d90d6e4e017be23ecdb9c7c
          path: kenkui
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-groups --extra hosted
      - name: Ensure independent PostgreSQL 17 fixture binaries
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gpg
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            test "$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1=="fpr"{print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            . /etc/os-release
            printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.sources
            sudo apt-get update
            sudo apt-get install -y postgresql-17
          fi
          test -x /usr/lib/postgresql/17/bin/pg_dump
          test -x /usr/lib/postgresql/17/bin/pg_restore
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: kenkui-server/hosted-api
      - run: npm run typecheck
        working-directory: kenkui-server/hosted-api
      - name: Relevant ingress and same-runtime contracts
        run: npm test -- test/standalone.test.ts test/release-environment.test.ts test/release-manifest.test.ts test/catalog.test.ts test/auth.test.ts test/stripe.test.ts test/assets.test.ts test/events.test.ts
        working-directory: kenkui-server/hosted-api
      - run: npm run build
        working-directory: kenkui-server/hosted-api
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Reviewed Docker context with the actual Moby matcher
        run: go test -mod=readonly ./...
        working-directory: kenkui-server/scripts/neon/docker-context
      - name: Archive authorization, resource bounds and guarded fallback verification
        env:
          KENKUI_PG_BIN: /usr/lib/postgresql/17/bin
          KENKUI_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55438/postgres
        run: node --test --test-timeout=240000 scripts/neon/test/*.test.mjs
      - name: Verify owner-only import and locked directory history
        env:
          KENKUI_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55438/postgres
        run: .venv/bin/python -m pytest -q tests/postgres/test_migration_directory.py
      - run: npm run smoke
        working-directory: kenkui-server/hosted-api
        env:
          KENKUI_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55438/postgres
      - name: Exact production artifacts with independently verified TLS
        run: node test/production-artifact.mjs
        working-directory: kenkui-server/hosted-api
        env:
          KENKUI_PG_BIN: /usr/lib/postgresql/17/bin
      - run: npm ci
        working-directory: kenkui-server/ingress
      - run: npm run types:check && npm run typecheck && npm test
        working-directory: kenkui-server/ingress
